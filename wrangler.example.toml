name = "skyphusion-llm"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Live play.skyphusion.org runs AUTH_MODE=public (first-party signup; CF Access
# is NOT used on play). Private self-hosts typically use AUTH_MODE=access with
# Access on a custom domain. Either way, keep workers_dev = false so the
# *.workers.dev URL is not an ungated alternate surface. NOTE: this is the
# committed TEMPLATE; the live worker deploys from the per-deployer
# wrangler.toml (gitignored), so set it there too and redeploy
# (defense-in-depth; fleet-chezmoi#46).
workers_dev = false

# No scheduled tasks. The render-notify sweep that used a `*/3` cron (resolving
# fire-and-forget renders) moved to vivijure; the scheduled() handler was stripped
# from src/index.ts. An empty crons list is explicit on purpose: omitting the
# [triggers] block leaves a previously-deployed cron in place (wrangler only syncs
# triggers it can see), so this clears the stale schedule on the next deploy.
[triggers]
crons = []

# AI binding. The unified binding handles Workers AI models directly and routes
# third-party Unified Billing models (chat partners, video, music, proxied image)
# through the Cloudflare AI Gateway. Anthropic, xAI, and Google chat hit the
# gateway's per-provider endpoints keylessly via cf-aig-authorization.
[ai]
binding = "AI"

# D1 database for chat history. Fill in database_id after running:
#   npx wrangler d1 create skyphusion-llm
[[d1_databases]]
binding = "DB"
database_name = "skyphusion-llm"
database_id = "PLACEHOLDER_RUN_wrangler_d1_create_THEN_PASTE_HERE"
# D1 schema migrations live in ./migrations/ (wrangler d1 migrations apply).
# CI applies pending migrations before every main deploy; see .github/workflows/ci.yml.

# R2 bucket for input + output artifacts (images, audio, video frames).
# Create with:
#   npx wrangler r2 bucket create skyphusion-llm
[[r2_buckets]]
binding = "R2"
bucket_name = "skyphusion-llm"

# Vectorize index for RAG document embeddings. 768 dimensions matches
# @cf/baai/bge-base-en-v1.5; cosine similarity.
# Create with:
#   npx wrangler vectorize create skyphusion-llm-vec --dimensions=768 --metric=cosine
[[vectorize]]
binding = "VEC"
index_name = "skyphusion-llm-vec"

# Static frontend (HTML, CSS, JS).
[assets]
directory = "./public"
binding = "ASSETS"
# REQUIRED for the security headers to exist at all (fleet-chezmoi#1646).
#
# Workers Assets serves a matching static file WITHOUT invoking the Worker. So
# with this line absent, `/` is answered entirely by the asset layer, the fetch
# handler never runs for the HTML document, and the Content-Security-Policy and
# HSTS headers it sets are dead code on exactly the responses that need them.
#
# That is not a theory: it was measured. Before this line, `curl -D - /` on a
# local dev server returned the HTML with NO policy header; after it, the policy
# is present, with a non-HTML asset checked as a control to confirm the document
# policy is not being sprayed onto subresources.
#
# Scoped to the HTML documents ONLY rather than set to `true`. Every path listed
# here stops being served from the asset fast path and costs a Worker
# invocation, so the list is the real documents plus the root.
#
# `/stt` IS THE STT DOCUMENT AND `/stt.html` IS NOT. Measured on a local dev
# server: `/stt.html` answers `307 -> /stt`, and `/stt` answers `200 text/html`
# with NO policy header, because only the redirecting path was listed here.
# Workers Assets `html_handling` drops the `.html` extension by default, so the
# path a browser actually holds the document at is the extensionless one. The
# same is true of `/index.html`, which `307`s to `/`; that one was covered only
# because `/` was listed beside it. Both spellings are kept: a deployer who
# turns `html_handling` off serves the `.html` path directly.
#
# The failure mode is the reason this comment is long: a listed path that only
# redirects produces no error anywhere. The page simply never carries a policy,
# never reports a violation, and an empty collector reads as a clean page.
#
# DEPLOYERS: wrangler.toml is gitignored and per-deployer, so this template
# change does NOT reach a live deploy on its own. Copy this line into your own
# wrangler.toml before deploying, or the CSP ships and silently never applies.
run_worker_first = ["/", "/index.html", "/stt", "/stt.html"]

# Cloudflare Workflow for long-running Unified Billing video and music gen
# (v0.12.0). env.AI.run for these models blocks until completion (30s-3min),
# which exceeds the ~30s waitUntil budget after an HTTP response. Workflows
# provide a durable execution primitive: the LongRunWorkflow class invokes the
# model, downloads the result, uploads to R2, and finalizes the D1 row across
# independently-retryable steps. Each instance is observable in the Cloudflare
# dashboard.
[[workflows]]
name = "skyphusion-longrun"
binding = "LONGRUN"
class_name = "LongRunWorkflow"

# v0.108.0: per-session DO wrapping a @cf/deepgram/flux conversational STT
# WebSocket; persists the final transcript to /history on close. Source:
# src/stt-session.ts.
[[durable_objects.bindings]]
name = "STT_SESSION"
class_name = "SttSession"

# Migration history (v1-v6): all tags are cursor-advance-only for new deployments.
#
# The live skyphusion-llm worker was built up incrementally via direct CF API calls
# and out-of-band dashboard ops, NOT purely through wrangler migration tags. By the
# time wrangler.example.toml was introduced as a deploy template, the live worker
# already had:
#   - SttSession DO namespace registered with use_sqlite=true (v3 intent applied)
#   - AudioBeatSyncContainer, ImagePrepContainer, VideoFinishContainer DO namespaces
#     deleted (v5 intent applied)
#
# Wrangler tracks migration cursor server-side. If the cursor is behind v6, trying
# to apply any of v1-v5 fails: new_sqlite_classes errors on existing instances
# (code 10074), and deleted_classes errors because those classes are no longer
# exported in the current script (also 10074). All tags below are therefore
# cursor-advance-only -- zero DO operations -- so wrangler skips past them cleanly
# to v6 regardless of where the cursor sits. DO state is correct on the live worker;
# these tags just bring the cursor in sync. (v0.164.2)
[[migrations]]
tag = "v1"

[[migrations]]
tag = "v2"

[[migrations]]
tag = "v3"

[[migrations]]
tag = "v4"

[[migrations]]
tag = "v5"

[[migrations]]
tag = "v6"

# Per-instance observability for the worker (lets you tail logs in the
# dashboard). Workflows have their own dashboard surface; this enables it
# for the rest of the worker too.
[observability]
enabled = true

# Deployment auth plane (v0.167.0, issue #80). A plain var, not a secret.
#   AUTH_MODE = "public"  -> first-party username/password accounts + session
#     cookies; identity is the opaque account id; per-user AI Gateway credentials
#     ONLY (worker GATEWAY_ID / CF_AIG_TOKEN are ignored so visitor inference
#     never bills the host). Do NOT set GATEWAY_ID / CF_AIG_TOKEN on a public
#     worker. No Cloudflare Access needed.
#   unset or "access"     -> Cloudflare Access in front, identity from the
#     Cf-Access-Authenticated-User-Email header (private self-host). Worker-secret
#     gateway fallback stays available. This is the default (back-compat).
# [vars]
# AUTH_MODE = "public"
# Control plane (v0.175.0): optional metered chat via prism-control-plane.
# Users store only a pcp_ key in prefs; origin is NOT user-set (SSRF).
# Default allowlisted host is play-proxy.skyphusion.org. Do NOT add another
# commented vars header (CI uncomments every "# [vars]" line and TOML breaks).
# CONTROL_PLANE_URL = "https://play-proxy.skyphusion.org"
# CONTROL_PLANE_ALLOW_LOCALHOST = "true"

# Note: GATEWAY_ID is set as a worker secret rather than a var in this file
# (v0.12.0+). This keeps deployer-specific values out of the committed template.
# Set it once after first deploy:
#   echo "your-gateway-slug" | npx wrangler secret put GATEWAY_ID
# For local development, also add it to .dev.vars:
#   GATEWAY_ID=your-gateway-slug
#
# Public mode (v0.167.0+): omit GATEWAY_ID and CF_AIG_TOKEN on the worker.
# Each visitor stores their own Cloudflare account id, gateway slug, and token
# via Account > AI Gateway (/api/prefs in D1 user_prefs); v1.1.0 requires the
# account id, since the AI binding can only reach this worker's own account.
# No Cloudflare Access needed when AUTH_MODE=public.
#
# Other worker secrets (also set via `npx wrangler secret put <NAME>`):
#   OPENAI_API_KEY (optional sole BYOK carve-out, v0.174.0): when set,
#     openai/gpt-image-* call api.openai.com directly for transparent PNG
#     (background + output_format). When unset, those models stay on Unified
#     Billing and render opaque. No other provider reads a deployer key.
#   CF_AIG_TOKEN (required for Anthropic, xAI, OpenAI chat, Google, and proxied
#                 image/video/music on Unified Billing when using worker-level
#                 credentials; optional in public demo mode where users supply
#                 their own token via /api/prefs; v0.93.0+),
#   SEARXNG_URL (optional, v0.166.0; base URL of a self-hosted SearXNG instance
#                for the opt-in web-search source, e.g. https://search.skyphusion.org.
#                May be a plain [vars] entry instead of a secret. Skipped when
#                unset; Wikipedia still runs keyless),
#   SEARXNG_ACCESS_CLIENT_ID / SEARXNG_ACCESS_CLIENT_SECRET (optional, v0.166.0;
#                Cloudflare Access service-token halves for a gated SearXNG
#                instance. Sent as CF-Access-Client-Id / CF-Access-Client-Secret
#                only when BOTH are set; leave unset for an un-gated instance).
