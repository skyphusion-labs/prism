name: tag-version

# fc#864: when a v* tag is pushed, assert it matches root package.json version.
# Production deploy is tag-gated in ci.yml (deploy job on refs/tags/v* only).
# This workflow only rejects a lying tag (vX.Y.Z != package.json version) so a
# mismatch cannot ship. publish-npm.yml guards create-prism releases separately.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Verify tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          tag_version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "Tag:              $tag (version $tag_version)"
          echo "package.json ver: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $tag (version $tag_version) does not match package.json version $pkg_version"
            exit 1
          fi
