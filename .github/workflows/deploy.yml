name: deploy

# TAG-GATED production deploy. Ordinary merges to main run ci.yml only.
# Cut a SemVer tag on main to ship: git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Assert tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA which is not on origin/main; refusing to deploy an unreviewed commit"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Render wrangler.toml
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i "s/PLACEHOLDER_RUN_wrangler_d1_create_THEN_PASTE_HERE/${{ secrets.D1_DATABASE_ID }}/" wrangler.toml
          sed -i 's/# \[vars\]/[vars]/' wrangler.toml
          sed -i 's/# AUTH_MODE = "public"/AUTH_MODE = "public"/' wrangler.toml
          # fleet-chezmoi#1636: the hosted index has its user_email metadata index and was backfilled,
          # so the hosted deploy filters RAG retrieval by user in Vectorize. Self-host stays opt-in.
          sed -i 's/# VEC_METADATA_FILTER = "on"/VEC_METADATA_FILTER = "on"/' wrangler.toml
          # Refuse to deploy without it: a template edit that renamed or moved the line would
          # otherwise drop the flag silently and the deploy would still go green.
          grep -qx 'VEC_METADATA_FILTER = "on"' wrangler.toml || { echo "::error::rendered wrangler.toml has no VEC_METADATA_FILTER = \"on\""; exit 1; }
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply skyphusion-llm --remote
      - name: Deploy
        run: |
          npm run deploy
          rm -f wrangler.toml
