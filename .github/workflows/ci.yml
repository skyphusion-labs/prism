name: ci

# Full CI (typecheck + tests) on GitHub-hosted runners on every push/PR.
# Production deploy lives in deploy.yml and is TAG-GATED (v* on main only).
# prism is PUBLIC: ubuntu-latest only (fork-safe), never the self-hosted fleet.
# pull_request has no branches filter so stacked PRs still get checks.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo. No write scopes on the token.
permissions:
  contents: read

# Supersede in-flight runs on the same ref so a queued run is never left behind
# stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # npm test runs BOTH vitest projects (v0.164.4): the Node pure-function
      # suite and the workerd fetch-handler integration suite
      # (@cloudflare/vitest-pool-workers). Both are fork-safe: local Miniflare
      # bindings, no secrets, no network, so this runs on ubuntu-latest.
      - run: npm test
